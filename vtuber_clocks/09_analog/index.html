<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-container">
        <div class="clock">
            <!-- Ticks generated by JS or fixed CSS -->
            <div class="ticks"></div>

            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="center-nut"></div>
        </div>
    </div>
    <script>
        // Generate Ticks
        const ticksContainer = document.querySelector('.ticks');
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.classList.add('tick');
            if (i % 5 === 0) tick.classList.add('major');
            tick.style.transform = `rotate(${i * 6}deg) translateY(-135px)`;
            ticksContainer.appendChild(tick);
        }

        function updateTime() {
            const now = new Date();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Smooth seconds: include milliseconds
            const secondDegrees = (((seconds + milliseconds / 1000) / 60) * 360);
            const minuteDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hourDegrees = ((hours / 12) * 360) + ((minutes / 60) * 30);

            document.querySelector('.second-hand').style.transform = `rotate(${secondDegrees}deg)`;
            document.querySelector('.minute-hand').style.transform = `rotate(${minuteDegrees}deg)`;
            document.querySelector('.hour-hand').style.transform = `rotate(${hourDegrees}deg)`;
        }
        setInterval(updateTime, 16); // 60fps for smooth sweep
        updateTime();
    </script>
</body>
</html>
