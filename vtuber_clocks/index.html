<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Clocks Gallery</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }
        h1 { text-align: center; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .clock-item {
            background: #333; /* Dark background to see the clocks */
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            height: 250px;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fff;
            text-align: center;
            padding: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>VTuber Clocks Gallery</h1>
    <div class="gallery">
        <div class="clock-item">
            <iframe src="01_simple/index.html"></iframe>
            <div class="label">01 Simple</div>
        </div>
        <div class="clock-item">
            <iframe src="02_neon/index.html"></iframe>
            <div class="label">02 Neon</div>
        </div>
        <div class="clock-item">
            <iframe src="03_kawaii/index.html"></iframe>
            <div class="label">03 Kawaii</div>
        </div>
        <div class="clock-item">
            <iframe src="04_pixel/index.html"></iframe>
            <div class="label">04 Pixel</div>
        </div>
        <div class="clock-item">
            <iframe src="05_elegant/index.html"></iframe>
            <div class="label">05 Elegant</div>
        </div>
        <div class="clock-item">
            <iframe src="06_glitch/index.html"></iframe>
            <div class="label">06 Glitch</div>
        </div>
        <div class="clock-item">
            <iframe src="07_glass/index.html"></iframe>
            <div class="label">07 Glass</div>
        </div>
        <div class="clock-item">
            <iframe src="08_japanese/index.html"></iframe>
            <div class="label">08 Japanese</div>
        </div>
        <div class="clock-item">
            <iframe src="09_analog/index.html"></iframe>
            <div class="label">09 Analog</div>
        </div>
        <div class="clock-item">
            <iframe src="10_flip/index.html"></iframe>
            <div class="label">10 Flip</div>
        </div>
    </div>
</body>
</html>
