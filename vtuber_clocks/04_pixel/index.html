<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel CRT Clock</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="monitor">
        <div class="screen">
            <div class="scanlines"></div>
            <div class="clock">
                <div class="time-line">
                    <span class="hour">00</span><span class="colon">:</span><span class="minute">00</span>
                </div>
                <div class="second-line">
                    <span class="second">00</span>
                </div>
            </div>
            <div class="overlay"></div>
        </div>
        <div class="power-led"></div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.querySelector('.hour').textContent = hours;
            document.querySelector('.minute').textContent = minutes;
            document.querySelector('.second').textContent = seconds;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
